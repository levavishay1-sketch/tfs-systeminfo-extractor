<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>TFS System Info Extractor</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root {
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f9fafb; --border:#e5e7eb;
    --text:#1a1d23; --muted:#6b7280;
    --accent:#4f46e5; --accent-2:#4338ca;
    --ok:#059669; --bad:#dc2626;
    --si-bg:#fffbeb; --si-border:#f5e2a8; --si-text:#6b4d10;
    --tvline:#c4cbd6; --tv-root-bg:#eef1f6; --tv-rail:#c3c9d4; --tv-rail-strong:#4f46e5;
    --radius:12px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e1014; --surface:#161922; --surface-2:#1c202b; --border:#2a2f3c;
      --text:#e6e8ec; --muted:#9aa3b2;
      --accent:#6366f1; --accent-2:#a5b4fc;
      --ok:#34d399; --bad:#f87171;
      --si-bg:#241f10; --si-border:#4a3f22; --si-text:#ecdcab;
      --tvline:#3a4150; --tv-root-bg:#1e222c; --tv-rail:#333a48; --tv-rail-strong:#6366f1;
      color-scheme: dark;
    }
  }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.55 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif; }
  a { color:var(--accent-2); }
  .topbar { background:linear-gradient(120deg, #312e81, #4f46e5); color:#fff; padding:18px 24px; }
  .brand { display:flex; align-items:center; gap:14px; max-width:1140px; margin:0 auto; }
  .logo { width:40px; height:40px; border-radius:10px; display:grid; place-items:center;
    background:rgba(255,255,255,.15); font-weight:700; letter-spacing:.5px; font-size:13px; }
  .brand-title { font-size:17px; font-weight:650; }
  .brand-sub { font-size:12.5px; opacity:.82; margin-top:2px; }
  main { max-width:1140px; margin:24px auto; padding:0 20px; display:flex; flex-direction:column; gap:18px; }
  main > .card { min-width:0; }
  .viewport { min-width:0; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:12px; flex-wrap:wrap; }
  .card-head h2 { margin:0; font-size:12.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.7px; color:var(--muted); }
  .hint { font-size:12px; color:var(--muted); }
  textarea { width:100%; min-height:96px; resize:vertical; padding:12px 14px; border:1px solid var(--border);
    border-radius:10px; background:var(--surface-2); color:var(--text);
    font:13px/1.5 'Cascadia Code', Consolas, monospace; }
  textarea:focus, .btn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .actions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  .btn { border:1px solid transparent; border-radius:9px; padding:9px 18px; font:inherit;
    font-weight:600; cursor:pointer; transition:background .12s, border-color .12s, opacity .12s; }
  .btn.sm { padding:6px 12px; font-size:12.5px; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.primary:hover { background:var(--accent-2); }
  .btn.primary:disabled { opacity:.55; cursor:default; }
  .btn.ok { background:var(--ok); color:#fff; }
  .btn.ok:hover { filter:brightness(1.06); }
  .btn.ghost { background:var(--surface-2); border-color:var(--border); color:var(--text); }
  .btn.ghost:hover { border-color:var(--muted); }
  .file-btn { position:relative; overflow:hidden; display:inline-block; }
  .file-btn input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .file-btn span { display:inline-block; padding:9px 18px; border-radius:9px; background:var(--surface-2);
    border:1px solid var(--border); font-weight:600; }
  .status { font-size:12.5px; font-weight:600; padding:4px 11px; border-radius:999px; }
  .status-idle { color:var(--muted); }
  .status-running { color:var(--accent-2); background:rgba(99,102,241,.14); }
  .status-done { color:var(--ok); background:rgba(5,150,105,.15); }
  .status-error { color:var(--bad); background:rgba(220,38,38,.13); }
  .log { margin:0; background:#0b0e14; color:#c9d5c3; border-radius:10px; padding:14px; height:260px;
    overflow:auto; white-space:pre-wrap; word-break:break-word;
    font:12px/1.55 'Cascadia Code', Consolas, monospace; }

  /* results toolbar */
  .results-top { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .bar2 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .stats { display:flex; gap:6px; flex-wrap:wrap; margin-right:auto; }
  .stat { font-size:12px; color:var(--muted); background:var(--surface-2); border:1px solid var(--border);
    padding:4px 9px; border-radius:999px; }
  .stat b { color:var(--text); }
  .stat.ok b { color:var(--ok); }
  .stat.bad b { color:var(--bad); }

  .badge { font-size:11px; font-weight:650; padding:2px 8px; border-radius:6px; white-space:nowrap; flex:none;
    background:hsl(var(--h) 60% 92%); color:hsl(var(--h) 55% 32%); }
  @media (prefers-color-scheme: dark) { .badge { background:hsl(var(--h) 38% 24%); color:hsl(var(--h) 70% 78%); } }
  .wid { font-size:12.5px; font-weight:600; color:var(--accent-2); text-decoration:none; white-space:nowrap; flex:none; }
  .wid:hover { text-decoration:underline; }
  .state { font-size:11px; color:var(--muted); border:1px solid var(--border); padding:1px 7px;
    border-radius:999px; white-space:nowrap; flex:none; }
  .empty { color:var(--muted); font-style:italic; padding:20px; text-align:center; }

  /* export menu */
  .exportwrap { position:relative; }
  .menu { position:absolute; right:0; top:calc(100% + 4px); z-index:20; min-width:190px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:4px;
    box-shadow:0 8px 24px rgba(0,0,0,.16); }
  .menu button { display:flex; width:100%; align-items:baseline; gap:8px; border:none; background:none;
    color:var(--text); font:inherit; font-weight:600; text-align:left; padding:8px 12px; border-radius:7px; cursor:pointer; }
  .menu button:hover { background:var(--surface-2); }

  /* clickable filter pill + toolbar extras */
  .statbtn { cursor:pointer; font:inherit; }
  .statbtn:hover { border-color:var(--muted); }
  .statbtn:disabled { cursor:default; opacity:.55; }
  .statbtn:disabled:hover { border-color:var(--border); }
  .stat.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stat.active b { color:#fff; }
  .view-table .cell-extra .none { color:var(--muted); }
  .filter-banner { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px;
    background:rgba(99,102,241,.12); border:1px solid var(--accent); color:var(--accent-2);
    border-radius:9px; padding:7px 12px; }
  .filter-banner button { font:inherit; font-weight:600; color:var(--accent-2); background:none;
    border:none; text-decoration:underline; cursor:pointer; padding:0; }
  .fieldpanel { position:absolute; right:0; top:calc(100% + 4px); z-index:20; width:260px; max-height:320px;
    overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.16); }
  .fieldpanel .empty-note { font-size:12px; color:var(--muted); padding:8px 10px; }
  .fieldpanel label { display:flex; gap:8px; align-items:baseline; padding:6px 8px; border-radius:7px;
    font-size:12.5px; cursor:pointer; }
  .fieldpanel label:hover { background:var(--surface-2); }
  .fieldchips { display:flex; gap:6px; flex-wrap:wrap; }
  .fieldchip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
    background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:2px 4px 2px 10px; }
  .fieldchip button { border:none; background:none; cursor:pointer; color:var(--muted); font-size:13px;
    line-height:1; padding:0 4px; border-radius:999px; }
  .fieldchip button:hover { color:var(--bad); }

  /* results table - grouped tree-table (the only result presentation) */
  /* The table always fits the viewport width - never a horizontal scrollbar. With
     table-layout:fixed the inline <col> percentage widths from vTable() shrink every
     column proportionally as extra fields are added; cells wrap and rows grow taller
     so the text stays readable. */
  .view-table .tv-wrap { width:100%; max-width:100%; }
  .view-table table.tv { width:100%; table-layout:fixed; border-collapse:collapse; font-size:12.5px; }
  .view-table .tv th, .view-table .tv td { text-align:left; padding:8px 10px; vertical-align:top;
    overflow-wrap:anywhere; word-break:break-word; }
  .view-table .tv thead th { color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px;
    background:var(--surface); position:sticky; top:0; z-index:1; border-bottom:1px solid var(--border); }
  .view-table .tv .cell-id a { font-weight:600; }
  .view-table .tv .cell-state { color:var(--muted); }
  .view-table .tv .cell-extra { color:var(--text); font-size:12px; }

  /* one <tbody> per root work item = one visually distinct group */
  .view-table .tv-grp > tr > td { border-bottom:1px solid var(--border); }
  .view-table .tv-grp > tr:last-child > td { border-bottom:none; }
  .view-table .tv-grp > tr:hover > td { background:var(--surface-2); }
  .view-table .tv-grp > tr > .cell-id { border-left:3px solid var(--tv-rail); }
  /* gap row between groups: whitespace separation, no borders */
  .view-table .tv-gap td { height:16px; padding:0; border:none; background:var(--bg); }

  .view-table .tv tr.tv-root > td { background:var(--tv-root-bg); padding-top:11px; padding-bottom:11px;
    border-top:1px solid var(--tvline); }
  .view-table .tv tr.tv-root > .cell-id { border-left-color:var(--tv-rail-strong); }
  .view-table .tv tr.tv-root .tv-name { font-weight:700; }
  .view-table .tv tr.err > td { background:rgba(220,38,38,.06); }

  /* TYPE cell now carries the hierarchy (indent + connectors + toggle) */
  .view-table .tv-type-inner { display:flex; align-items:flex-start; min-width:0; }
  .view-table .tv-guide { flex:none; width:16px; align-self:stretch; position:relative; }
  .view-table .tv-guide.line::before { content:''; position:absolute; left:8px; top:0; bottom:0;
    border-left:1.5px solid var(--tvline); }
  .view-table .tv-guide.elbow::after { content:''; position:absolute; left:8px; top:0; height:15px;
    width:8px; border-left:1.5px solid var(--tvline); border-bottom:1.5px solid var(--tvline); border-bottom-left-radius:6px; }
  .view-table .tv-toggle { flex:none; width:16px; height:16px; margin-right:4px; padding:0; border:none;
    background:none; cursor:pointer; position:relative; align-self:flex-start; margin-top:1px; }
  .view-table .tv-toggle::before { content:''; position:absolute; top:50%; left:50%; width:0; height:0;
    border-left:5px solid var(--muted); border-top:4px solid transparent; border-bottom:4px solid transparent;
    transform:translate(-50%,-50%); transition:transform .12s; }
  .view-table .tv-toggle.open::before { transform:translate(-50%,-50%) rotate(90deg); }
  .view-table .tv-toggle.leaf::before { border:none; width:4px; height:4px; border-radius:50%; background:var(--tvline); }
  .view-table .tv-typebox { min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 6px; }
  .view-table .tv-typebox .badge { flex:none; }
  .view-table .tv-typebox .kids { font-size:10.5px; font-weight:600; color:var(--muted);
    background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:0 6px; }
  .view-table .tv-typebox .lvl { font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .view-table .tv-name { min-width:0; word-break:break-word; }
  .view-table .tv-parent { display:none; font-size:11px; color:var(--muted); margin-top:3px; width:100%; }

  .view-table .tv-si { position:relative; white-space:pre-wrap; word-break:break-word; }
  .view-table .tv-si.err { color:var(--bad); }
  .view-table .tv-si .body { max-height:none; }
  .view-table .tv-si.clamped .body { max-height:150px; overflow:hidden;
    -webkit-mask-image:linear-gradient(#000 65%, transparent); mask-image:linear-gradient(#000 65%, transparent); }
  .view-table .tv-si .more { margin-top:4px; font-size:11px; font-weight:600; color:var(--accent-2);
    background:none; border:none; padding:0; cursor:pointer; }
  .view-table .tv-si .none { color:var(--muted); font-style:italic; }

  /* SOURCE CONTROL column + attached detail row (optional, off by default) */
  #scBtn.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .view-table .cell-sc { font-size:12px; }
  .view-table .tv-sc { display:flex; align-items:flex-start; gap:6px; min-width:0; }
  .view-table .tv-sc-toggle { flex:none; width:16px; height:16px; margin-top:1px; padding:0; border:none;
    background:none; cursor:pointer; position:relative; }
  .view-table .tv-sc-toggle::before { content:''; position:absolute; top:50%; left:50%; width:0; height:0;
    border-left:5px solid var(--muted); border-top:4px solid transparent; border-bottom:4px solid transparent;
    transform:translate(-50%,-50%); transition:transform .12s; }
  .view-table .tv-sc-toggle.open::before { transform:translate(-50%,-50%) rotate(90deg); }
  .view-table .tv-sc-sum { min-width:0; display:flex; flex-wrap:wrap; gap:3px 5px; align-items:baseline; }
  .view-table .tv-sc-sum .scpill { font-size:10.5px; font-weight:600; color:var(--muted); white-space:nowrap;
    background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:0 6px; }
  .view-table .tv-sc-none { color:var(--muted); }
  /* the detail row sits in the same group tbody, attached under its Work Item row */
  .view-table .tv-grp > tr.has-sc-open > td { border-bottom:none; }
  .view-table .tv-grp > tr.tv-sc-row > td { padding:0; background:var(--surface-2); }
  .view-table .tv-grp > tr.tv-sc-row:hover > td { background:var(--surface-2); }
  .view-table .tv-sc-detail { padding:10px 14px 12px; border-left:3px solid var(--tv-rail-strong); }
  .view-table .tv-sc-section + .tv-sc-section { margin-top:10px; }
  .view-table .tv-sc-h { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted); margin-bottom:6px; }
  .view-table .tv-sc-repo + .tv-sc-repo { margin-top:8px; }
  .view-table .tv-sc-repo-name { font-size:11.5px; font-weight:650; margin-bottom:3px; }
  .view-table .tv-sc-commits { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
  .view-table .tv-sc-commits li { font-size:12px; padding-left:10px; border-left:2px solid var(--border); }
  .view-table .tv-sc-cline { display:flex; flex-wrap:wrap; align-items:baseline; gap:3px 8px; }
  .view-table .tv-sc-files { margin-top:3px; display:flex; flex-direction:column; gap:1px; }
  .view-table .tv-sc-file { font-family:'Cascadia Code', Consolas, monospace; font-size:10.5px; color:var(--muted);
    white-space:pre-wrap; word-break:break-all; }
  .view-table .tv-sc-file.more { font-family:inherit; font-style:italic; }
  .view-table .tv-sc-sha { font-family:'Cascadia Code', Consolas, monospace; font-size:11px; font-weight:600;
    color:var(--accent-2); text-decoration:none; flex:none; }
  .view-table a.tv-sc-sha:hover { text-decoration:underline; }
  .view-table .tv-sc-msg { min-width:0; word-break:break-word; }
  .view-table .tv-sc-meta { font-size:11px; color:var(--muted); flex:none; }
  .view-table .tv-sc-devs { font-size:11.5px; color:var(--muted); }
  .view-table .tv-sc-complist { display:flex; flex-wrap:wrap; gap:4px; }
  .view-table .tv-sc-comp { flex:none; font-size:10.5px; font-weight:600; color:var(--si-text);
    background:var(--si-bg); border:1px solid var(--si-border); border-radius:5px; padding:0 6px; }

</style>
</head>
<body>
<header class='topbar'>
  <div class='brand'>
    <div class='logo'>TFS</div>
    <div>
      <div class='brand-title'>System Info Extractor</div>
      <div class='brand-sub'>Walks every Work Item child recursively and extracts the System Info field</div>
    </div>
  </div>
</header>
<main>
  <section class='card'>
    <div class='card-head'>
      <h2>Work Item IDs</h2>
      <span class='hint' id='idCount'></span>
    </div>
    <textarea id='ids' spellcheck='false' placeholder='46269, 44065, 42629 - or one per line'></textarea>
    <div class='actions'>
      <label class='file-btn'><input type='file' id='file' accept='.txt,.csv'><span>Upload file</span></label>
      <button class='btn ghost' id='clearBtn' type='button'>Clear</button>
      <button class='btn primary' id='runBtn' type='button'>Run</button>
    </div>
  </section>

  <section class='card' id='progressCard' hidden>
    <div class='card-head'>
      <h2>Progress</h2>
      <span class='status status-idle' id='status'></span>
    </div>
    <pre class='log' id='log'></pre>
  </section>

  <section class='card' id='resultsCard' hidden>
    <div class='card-head'><h2>Results</h2></div>
    <div class='results-top'>
      <div class='bar2'>
        <div class='stats'>
          <span class='stat'><b id='statTotal'>0</b> items</span>
          <button class='stat ok statbtn' id='filterInfoBtn' type='button' aria-pressed='false'><b id='statInfo'>0</b> with system info</button>
          <span class='stat bad' id='statErrWrap' hidden><b id='statErr'>0</b> errors</span>
          <span class='stat'>depth <b id='statDepth'>0</b></span>
        </div>
        <button class='btn ghost sm' id='expandAll' type='button' hidden>Expand all</button>
        <button class='btn ghost sm' id='collapseAll' type='button' hidden>Collapse all</button>
        <!-- expand/collapse operate on the table hierarchy; shown only when there is one -->

        <span class='exportwrap' id='fieldsWrap' hidden>
          <button class='btn ghost sm' id='fieldsBtn' type='button'>Fields</button>
          <div class='fieldpanel' id='fieldPanel' hidden></div>
        </span>
        <button class='btn ghost sm' id='scBtn' type='button' aria-pressed='false'>Source Control</button>
        <span class='exportwrap'>
          <button class='btn ok sm' id='exportBtn' type='button'>Download / Export</button>
          <div class='menu' id='exportMenu' hidden>
            <button type='button' data-fmt='xlsx'>Excel</button>
            <button type='button' data-fmt='pdf'>PDF</button>
            <button type='button' data-fmt='json'>JSON</button>
            <button type='button' data-fmt='md'>Markdown</button>
          </div>
        </span>
      </div>
      <div class='filter-banner' id='filterBanner' hidden>
        <span id='filterBannerText'></span>
        <button id='clearFilterBtn' type='button'>Show all</button>
      </div>
      <div class='fieldchips' id='fieldChips' hidden></div>
    </div>
    <div class='viewport' id='viewport'></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let jobId = null, timer = null;

$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { $('#ids').value = r.result; updateCount(); };
  r.readAsText(f, 'utf-8');
});
$('#ids').addEventListener('input', updateCount);
function updateCount() {
  const n = ($('#ids').value.match(/\d+/g) || []).length;
  $('#idCount').textContent = n ? (n + (n === 1 ? ' id' : ' ids')) : '';
}
$('#clearBtn').addEventListener('click', () => { $('#ids').value = ''; $('#file').value = ''; updateCount(); $('#ids').focus(); });
$('#runBtn').addEventListener('click', run);

async function run() {
  const ids = $('#ids').value;
  if (!ids.trim()) { $('#ids').focus(); return; }
  $('#runBtn').disabled = true;
  $('#runBtn').textContent = 'Running...';
  setStatus('running', 'Starting');
  $('#progressCard').hidden = false;
  $('#resultsCard').hidden = true;
  $('#log').textContent = '';
  let resp;
  try { resp = await fetch('/api/run', { method: 'POST', body: ids }); }
  catch (e) { fail('Cannot reach the local server.'); return; }
  if (!resp.ok) { fail(await resp.text()); return; }
  jobId = (await resp.json()).jobId;
  timer = setInterval(poll, 700);
}
function fail(msg) {
  setStatus('error', msg || 'Error');
  $('#runBtn').disabled = false;
  $('#runBtn').textContent = 'Run';
}
async function poll() {
  let data;
  try {
    const r = await fetch('/api/status?jobId=' + jobId);
    if (!r.ok) return;
    data = await r.json();
  } catch (e) { return; }
  const log = $('#log');
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.textContent = data.log.join('\n');
  if (atBottom) log.scrollTop = log.scrollHeight;
  if (!data.done) { setStatus('running', data.processed + ' work items processed'); return; }
  clearInterval(timer);
  $('#runBtn').disabled = false;
  $('#runBtn').textContent = 'Run';
  if (data.error) setStatus('error', data.error);
  else setStatus('done', 'Done - ' + data.processed + ' work items');
  if (data.hasResult) { $('#resultsCard').hidden = false; loadResults(); }
}
function setStatus(kind, text) {
  const el = $('#status');
  el.className = 'status status-' + kind;
  el.textContent = text;
}

/* ---------- results ---------- */
/* The table is the only result presentation. Filtering, the hierarchy, the
   optional extra-field columns and the exports all build on it. */
let roots = null, flat = [], byId = {}, stats = null, collapsed = new Set();

async function loadResults() {
  const r = await fetch('/api/result?jobId=' + jobId);
  const data = await r.json();
  roots = data.Roots || [];
  resultGeneratedAt = data.GeneratedAt || '';
  availableFields = data.AvailableFields || [];
  fieldLabels = {};
  availableFields.forEach(f => { fieldLabels[f.ReferenceName] = f.DisplayName; });
  extraFields = extraFields.filter(ref => fieldLabels[ref]);
  filterWithInfo = false;
  flat = [];
  byId = {};
  (function rec(nodes, depth, parent, ancLast) {
    nodes.forEach((n, i) => {
      n._depth = depth;
      n._parent = parent;
      n._last = i === nodes.length - 1;
      n._ancLast = ancLast;
      n._kids = n.Children ? n.Children.length : 0;
      byId[n.Id] = n;
      flat.push(n);
      if (n._kids) rec(n.Children, depth + 1, n.Id, ancLast.concat(n._last));
    });
  })(roots, 0, null, []);
  collapsed = new Set();
  scExpanded = new Set();

  stats = { total: flat.length, withInfo: 0, errors: 0, depth: 0 };
  flat.forEach(n => {
    if (n.Error) stats.errors++;
    else if (hasInfo(n)) stats.withInfo++;
    if (n._depth > stats.depth) stats.depth = n._depth;
  });
  $('#statTotal').textContent = stats.total;
  $('#statInfo').textContent = stats.withInfo;
  $('#statErr').textContent = stats.errors;
  $('#statErrWrap').hidden = stats.errors === 0;
  $('#statDepth').textContent = stats.depth;
  $('#filterInfoBtn').disabled = stats.withInfo === 0;

  renderFieldPanel();
  $('#fieldsWrap').hidden = availableFields.length === 0;
  $('#expandAll').hidden = $('#collapseAll').hidden = stats.depth === 0;
  updateFilterUi();
  updateScUi();
  renderFieldChips();
  render();
}

function hasInfo(n) { return !n.Error && n.SystemInfo != null && String(n.SystemInfo).trim() !== ''; }
function hue(t) { let h = 0; for (const c of (t || '?')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function badge(n) { const b = el('span', 'badge', n.Type || '?'); b.style.setProperty('--h', hue(n.Type)); return b; }
function widLink(n, cls) {
  const a = el('a', cls || 'wid', '#' + n.Id);
  if (n.Url) { a.href = n.Url; a.target = '_blank'; a.rel = 'noopener'; }
  return a;
}

function render() {
  const vp = $('#viewport');
  vp.className = 'viewport view-table';
  vp.innerHTML = '';
  vTable(vp);
}

$('#expandAll').addEventListener('click', () => { collapsed.clear(); render(); });
$('#collapseAll').addEventListener('click', () => {
  (function rec(nodes) { nodes.forEach(rn => { if (rn.children.length) { collapsed.add(rn.n.Id); rec(rn.children); } }); })(tableForest(filterWithInfo));
  render();
});

/* the results table: grouped tree-table, "with system info" filter, optional extra columns */
let filterWithInfo = false;
let resultGeneratedAt = '';
let availableFields = [];   // [{ ReferenceName, DisplayName }]
let fieldLabels = {};       // referenceName -> displayName
let extraFields = [];       // referenceNames, persisted
try { const s = JSON.parse(localStorage.getItem('tfsExtraFields') || '[]'); if (Array.isArray(s)) extraFields = s.filter(x => typeof x === 'string'); } catch (e) {}
function saveExtraFields() { try { localStorage.setItem('tfsExtraFields', JSON.stringify(extraFields)); } catch (e) {} }

/* Source Control: an optional column right after System Info, off by default and
   completely independent of the extra-field selection above. Its per-Work-Item
   details expand into an attached row inside the same group. */
let scOn = false;
try { scOn = localStorage.getItem('tfsSourceControl') === '1'; } catch (e) {}
let scExpanded = new Set();  // Work Item ids whose detail row is open
function saveSc() { try { localStorage.setItem('tfsSourceControl', scOn ? '1' : '0'); } catch (e) {} }

function toggleCollapse(id) {
  if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
  render();
}
function toggleScExpand(id) {
  if (scExpanded.has(id)) scExpanded.delete(id); else scExpanded.add(id);
  render();
}
function fieldLabel(ref) { return fieldLabels[ref] || ref; }
function tableColumnCount() { return 5 + (scOn ? 1 : 0) + extraFields.length; }

// Normalises a node's SourceControlInfo (repositories / commits / contributors /
// components) into what the column needs. Returns null when there is nothing to show
// - so no empty expander appears. Add PRs / branches / builds here as SourceControlInfo grows.
function scData(n) {
  const sc = n && n.SourceControl;
  if (!sc) return null;
  const commits = sc.Commits || [];
  const repos = sc.Repositories || [];
  const contributors = (sc.Contributors || []).map(d => d.DisplayName || d.Name).filter(Boolean);
  const commitDevs = commits.map(c => c.Author && (c.Author.DisplayName || c.Author.Name)).filter(Boolean);
  const devs = new Set(contributors.length ? contributors : commitDevs);
  const repoKeys = repos.length ? repos.map(rp => rp.Id)
    : Array.from(new Set(commits.map(c => c.RepositoryId).filter(Boolean)));
  const componentNames = new Set((sc.Components || []).map(c => c.Name).filter(Boolean));
  commits.forEach(c => (c.Components || []).forEach(x => { if (x) componentNames.add(x); }));
  if (!commits.length && !repoKeys.length && !devs.size && !componentNames.size) return null;
  return { sc: sc, commits: commits, repos: repos,
    nCommits: commits.length, nRepos: repoKeys.length, nDevs: devs.size,
    nComponents: componentNames.size, componentNames: Array.from(componentNames) };
}
function scSummaryText(d) {
  const parts = [];
  if (d.nCommits) parts.push(d.nCommits + (d.nCommits === 1 ? ' commit' : ' commits'));
  if (d.nRepos) parts.push(d.nRepos + (d.nRepos === 1 ? ' repo' : ' repos'));
  if (d.nComponents) parts.push(d.nComponents + (d.nComponents === 1 ? ' component' : ' components'));
  if (d.nDevs) parts.push(d.nDevs + (d.nDevs === 1 ? ' dev' : ' devs'));
  return parts.join(' · ');
}
function scFmtDate(s) {
  const dt = new Date(s);
  if (isNaN(dt.getTime())) return String(s);
  const p = x => String(x).padStart(2, '0');
  return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate()) + ' ' + p(dt.getHours()) + ':' + p(dt.getMinutes());
}

// The forest to render. With infoFilter, a pruned forest containing ONLY Work Items
// that have System Info: removed items are dropped entirely and their System-Info
// descendants are re-parented to the nearest surviving ancestor, so the hierarchy
// among the remaining items is preserved.
function tableForest(infoFilter) {
  if (!infoFilter) {
    return roots.map(function wrap(n) { return { n: n, children: (n.Children || []).map(wrap) }; });
  }
  const out = [];
  roots.forEach(r => collect(r, out));
  function collect(n, siblingList) {
    if (hasInfo(n)) {
      const node = { n: n, children: [] };
      siblingList.push(node);
      (n.Children || []).forEach(c => collect(c, node.children));
    } else {
      (n.Children || []).forEach(c => collect(c, siblingList));
    }
  }
  return out;
}

// Flatten the forest for the current collapse state, with per-row tree-render metadata.
function visibleTableRows(infoFilter) {
  const out = [];
  const forest = tableForest(infoFilter);
  forest.forEach((rn, i) => walk(rn, 0, [], i === forest.length - 1, null));
  function walk(rn, depth, ancLast, isLast, parentId) {
    const expanded = !collapsed.has(rn.n.Id);
    out.push({
      n: rn.n, depth: depth, last: isLast, ancLast: ancLast, expanded: expanded,
      hasKids: rn.children.length > 0, kidCount: rn.children.length, parentId: parentId
    });
    if (expanded) rn.children.forEach((c, i) => walk(c, depth + 1, ancLast.concat(isLast), i === rn.children.length - 1, rn.n.Id));
  }
  return out;
}

function vTable(vp, infoFilter) {
  if (infoFilter === undefined) infoFilter = filterWithInfo;
  const rows = visibleTableRows(infoFilter);
  const wrap = el('div', 'tv-wrap');
  const tbl = el('table', 'tv');

  // Every column gets a relative weight - the 5 default columns, an optional Source
  // Control column, then one per selected extra field. The weights are emitted as
  // <col> percentages; with table-layout:fixed and width:100% the table always fills
  // (and never exceeds) the viewport, so adding columns shrinks every column
  // proportionally. Cells wrap and rows grow taller rather than the table scrolling.
  const DEFAULT_WIDTHS = [62, 210, 230, 78, 300];   // ID, Type, Title, State, System Info
  const SC_WIDTH = 165;                             // Source Control (when enabled)
  const EXTRA_WIDTH = 125;                          // per additional TFS field
  const widths = DEFAULT_WIDTHS
    .concat(scOn ? [SC_WIDTH] : [])
    .concat(extraFields.map(() => EXTRA_WIDTH));
  const total = widths.reduce((a, b) => a + b, 0);

  const cg = document.createElement('colgroup');
  const classes = ['c-id', 'c-type', 'c-title', 'c-state', 'c-si']
    .concat(scOn ? ['c-sc'] : [])
    .concat(extraFields.map(() => 'c-extra'));
  classes.forEach((cls, i) => {
    const col = document.createElement('col');
    col.className = cls;
    col.style.width = (widths[i] / total * 100).toFixed(3) + '%';
    cg.appendChild(col);
  });
  tbl.appendChild(cg);

  const thead = el('thead');
  const htr = el('tr');
  ['ID', 'Type', 'Title', 'State', 'System Info'].forEach(h => htr.appendChild(el('th', null, h)));
  if (scOn) htr.appendChild(el('th', null, 'Source Control'));
  extraFields.forEach(ref => htr.appendChild(el('th', null, fieldLabel(ref))));
  thead.appendChild(htr);
  tbl.appendChild(thead);

  if (!rows.length) {
    const tb = el('tbody');
    const tr = el('tr');
    const td = el('td', 'empty', infoFilter ? 'No Work Items have System Info.' : 'No Work Items to show.');
    td.colSpan = tableColumnCount();
    tr.appendChild(td); tb.appendChild(tr); tbl.appendChild(tb);
    wrap.appendChild(tbl); vp.appendChild(wrap);
    return;
  }

  let group = null, groupIndex = -1;
  rows.forEach(r => {
    if (r.depth === 0) {
      groupIndex++;
      if (groupIndex > 0) {
        const gap = el('tbody', 'tv-gap');
        const gtr = el('tr'); const gtd = el('td'); gtd.colSpan = tableColumnCount(); gtr.appendChild(gtd); gap.appendChild(gtr);
        tbl.appendChild(gap);
      }
      group = el('tbody', 'tv-grp');
      tbl.appendChild(group);
    }
    group.appendChild(tableRow(r));
    if (scOn) {
      const d = scData(r.n);
      if (d && scExpanded.has(r.n.Id)) group.appendChild(scDetailRow(r, d));
    }
  });

  wrap.appendChild(tbl);
  vp.appendChild(wrap);
}

function tableRow(r) {
  const n = r.n;
  const isRoot = r.depth === 0;
  let cls = isRoot ? 'tv-root' : '';
  if (n.Error) cls += ' err';
  const tr = el('tr', cls.trim() || null);

  // ID
  const cId = el('td', 'cell-id'); cId.dataset.label = 'ID'; cId.appendChild(widLink(n)); tr.appendChild(cId);

  // TYPE - now carries the hierarchy (indent guides + toggle + level + child count)
  const cType = el('td', 'cell-type'); cType.dataset.label = 'Type';
  const tinner = el('div', 'tv-type-inner');
  for (let i = 0; i < r.depth; i++) {
    const g = el('span', 'tv-guide');
    if (i < r.depth - 1) { if (!r.ancLast[i]) g.classList.add('line'); }
    else { g.classList.add('elbow'); if (!r.last) g.classList.add('line'); }
    tinner.appendChild(g);
  }
  const tog = el('button', 'tv-toggle' + (r.hasKids ? '' : ' leaf')); tog.type = 'button';
  if (r.hasKids) {
    if (r.expanded) tog.classList.add('open');
    tog.setAttribute('aria-label', 'toggle children');
    tog.addEventListener('click', ev => { ev.stopPropagation(); toggleCollapse(n.Id); });
  }
  tinner.appendChild(tog);

  const tbox = el('div', 'tv-typebox');
  tbox.appendChild(badge(n));
  if (!isRoot) tbox.appendChild(el('span', 'lvl', 'L' + r.depth));
  if (r.kidCount) tbox.appendChild(el('span', 'kids', r.kidCount + (r.kidCount === 1 ? ' child' : ' children')));
  if (r.parentId != null) {
    const pn = byId[r.parentId];
    tbox.appendChild(el('div', 'tv-parent', 'child of #' + r.parentId + (pn && pn.Title ? (' - ' + pn.Title) : '')));
  }
  tinner.appendChild(tbox);
  cType.appendChild(tinner);
  tr.appendChild(cType);

  // TITLE - the Work Item name only
  const cTitle = el('td', 'cell-title'); cTitle.dataset.label = 'Title';
  const nm = el('span', 'tv-name', n.Title || '(untitled)'); nm.dir = 'auto';
  cTitle.appendChild(nm);
  tr.appendChild(cTitle);

  // STATE
  const cState = el('td', 'cell-state', n.State || ''); cState.dataset.label = 'State'; tr.appendChild(cState);

  // SYSTEM INFO
  const cSi = el('td', 'cell-si'); cSi.dataset.label = 'System Info';
  const si = el('div', 'tv-si' + (n.Error ? ' err' : ''));
  if (n.Error) {
    si.appendChild(el('div', 'body', n.Error));
  } else if (hasInfo(n)) {
    const body = el('div', 'body', n.SystemInfo); body.dir = 'auto';
    si.appendChild(body);
    requestAnimationFrame(() => {
      if (body.scrollHeight > 170) {
        si.classList.add('clamped');
        const more = el('button', 'more', 'Show full System Info'); more.type = 'button';
        more.addEventListener('click', () => {
          const open = si.classList.toggle('clamped');
          more.textContent = open ? 'Show full System Info' : 'Show less';
        });
        si.appendChild(more);
      }
    });
  } else {
    si.appendChild(el('div', 'none', 'no System Info'));
  }
  cSi.appendChild(si);
  tr.appendChild(cSi);

  // SOURCE CONTROL - compact summary; expands into an attached detail row (see vTable)
  if (scOn) {
    const cSc = el('td', 'cell-sc'); cSc.dataset.label = 'Source Control';
    const d = scData(n);
    if (d) {
      const box = el('div', 'tv-sc');
      const expanded = scExpanded.has(n.Id);
      const tg = el('button', 'tv-sc-toggle' + (expanded ? ' open' : '')); tg.type = 'button';
      tg.setAttribute('aria-label', 'toggle source control details');
      tg.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      tg.addEventListener('click', ev => { ev.stopPropagation(); toggleScExpand(n.Id); });
      box.appendChild(tg);
      const sum = el('div', 'tv-sc-sum');
      [[d.nCommits, 'commit'], [d.nRepos, 'repo'], [d.nComponents, 'component'], [d.nDevs, 'dev']].forEach(pair => {
        if (pair[0]) sum.appendChild(el('span', 'scpill', pair[0] + ' ' + pair[1] + (pair[0] === 1 ? '' : 's')));
      });
      box.appendChild(sum);
      cSc.appendChild(box);
      if (expanded) tr.classList.add('has-sc-open');
    } else {
      cSc.appendChild(el('span', 'tv-sc-none', '—'));
    }
    tr.appendChild(cSc);
  }

  // EXTRA FIELDS (opt-in columns)
  extraFields.forEach(ref => {
    const c = el('td', 'cell-extra'); c.dataset.label = fieldLabel(ref);
    const value = (n.Fields && n.Fields[ref]) || '';
    const d = el('div', value ? null : 'none', value || '-'); d.dir = 'auto';
    c.appendChild(d);
    tr.appendChild(c);
  });

  return tr;
}

// The expandable detail for one Work Item's source control. It lives in the same
// group <tbody>, directly after its Work Item row, spanning all columns - so the
// hierarchy, grouping, colours and borders are untouched. Sections are added per
// facet, ready for pull requests / branches / builds later.
function scDetailRow(r, d) {
  const tr = el('tr', 'tv-sc-row');
  const td = el('td'); td.colSpan = tableColumnCount();
  td.appendChild(scDetail(d));
  tr.appendChild(td);
  return tr;
}
function scDetail(d) {
  const wrap = el('div', 'tv-sc-detail');

  if (d.commits.length) {
    const sec = el('div', 'tv-sc-section');
    sec.appendChild(el('div', 'tv-sc-h', 'Commits'));
    const repoName = {};
    d.repos.forEach(rp => { repoName[rp.Id] = rp.Name; });
    const byRepo = new Map();
    d.commits.forEach(c => {
      const key = c.RepositoryId || '';
      if (!byRepo.has(key)) byRepo.set(key, []);
      byRepo.get(key).push(c);
    });
    byRepo.forEach((commits, key) => {
      const rb = el('div', 'tv-sc-repo');
      rb.appendChild(el('div', 'tv-sc-repo-name', repoName[key] || key || 'Repository'));
      const ul = el('ul', 'tv-sc-commits');
      commits.forEach(c => {
        const li = document.createElement('li');
        const top = el('div', 'tv-sc-cline');
        const sha = el(c.Url ? 'a' : 'span', 'tv-sc-sha', String(c.Id || '').slice(0, 8) || '—');
        if (c.Url) { sha.href = c.Url; sha.target = '_blank'; sha.rel = 'noopener'; }
        top.appendChild(sha);
        const msg = el('span', 'tv-sc-msg', c.Message || '(no message)'); msg.dir = 'auto';
        top.appendChild(msg);
        const who = c.Author && (c.Author.DisplayName || c.Author.Name);
        const meta = [who, c.CommittedOn ? scFmtDate(c.CommittedOn) : ''].filter(Boolean).join(' · ');
        if (meta) top.appendChild(el('span', 'tv-sc-meta', meta));
        (c.Components || []).forEach(name => top.appendChild(el('span', 'tv-sc-comp', name)));
        li.appendChild(top);
        const changed = c.ChangedPaths || [];
        if (changed.length) {
          const files = el('div', 'tv-sc-files');
          changed.slice(0, 8).forEach(p => files.appendChild(el('div', 'tv-sc-file', p)));
          if (changed.length > 8) files.appendChild(el('div', 'tv-sc-file more', '+ ' + (changed.length - 8) + ' more'));
          li.appendChild(files);
        }
        ul.appendChild(li);
      });
      rb.appendChild(ul);
      sec.appendChild(rb);
    });
    wrap.appendChild(sec);
  }

  if (d.componentNames && d.componentNames.length) {
    const sec = el('div', 'tv-sc-section');
    sec.appendChild(el('div', 'tv-sc-h', d.componentNames.length === 1 ? 'Component' : 'Components'));
    const list = el('div', 'tv-sc-complist');
    d.componentNames.slice().sort().forEach(name => list.appendChild(el('span', 'tv-sc-comp', name)));
    sec.appendChild(list);
    wrap.appendChild(sec);
  }

  const inCommits = new Set(d.commits.map(c => c.Author && (c.Author.DisplayName || c.Author.Name)).filter(Boolean));
  const others = (d.sc.Contributors || []).map(x => x.DisplayName || x.Name).filter(x => x && !inCommits.has(x));
  if (others.length) {
    const sec = el('div', 'tv-sc-section');
    sec.appendChild(el('div', 'tv-sc-h', 'Other contributors'));
    sec.appendChild(el('div', 'tv-sc-devs', others.join(', ')));
    wrap.appendChild(sec);
  }

  if (!wrap.childNodes.length) {
    wrap.appendChild(el('div', 'tv-sc-devs', 'No commit details available.'));
  }
  return wrap;
}

/* filter: "with system info" */

/* additional TFS field columns */
$('#fieldsBtn').addEventListener('click', e => { e.stopPropagation(); $('#fieldPanel').hidden = !$('#fieldPanel').hidden; });
$('#fieldPanel').addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => { $('#fieldPanel').hidden = true; });
function renderFieldPanel() {
  const panel = $('#fieldPanel');
  panel.innerHTML = '';
  if (!availableFields.length) {
    panel.appendChild(el('div', 'empty-note', 'No additional TFS fields were found on these Work Items.'));
    return;
  }
  availableFields.forEach(f => {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = extraFields.indexOf(f.ReferenceName) >= 0;
    cb.addEventListener('change', () => {
      if (cb.checked) { if (extraFields.indexOf(f.ReferenceName) < 0) extraFields.push(f.ReferenceName); }
      else { extraFields = extraFields.filter(x => x !== f.ReferenceName); }
      saveExtraFields();
      renderFieldChips();
      render();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(f.DisplayName));
    panel.appendChild(label);
  });
}
function renderFieldChips() {
  const wrap = $('#fieldChips');
  wrap.innerHTML = '';
  const show = extraFields.length > 0;
  wrap.hidden = !show;
  if (!show) return;
  extraFields.forEach(ref => {
    const chip = el('span', 'fieldchip');
    chip.appendChild(document.createTextNode(fieldLabel(ref)));
    const x = el('button', null, '×'); x.type = 'button'; x.setAttribute('aria-label', 'remove ' + fieldLabel(ref));
    x.addEventListener('click', () => {
      extraFields = extraFields.filter(r => r !== ref);
      saveExtraFields();
      renderFieldPanel();
      renderFieldChips();
      render();
    });
    chip.appendChild(x);
    wrap.appendChild(chip);
  });
}

/* ---------- export ----------
   Everything is built from the CURRENT table state at the moment of the click.
   Nothing is generated or cached before the user picks an action. */
const exportBtn = $('#exportBtn'), exportMenu = $('#exportMenu');

exportBtn.addEventListener('click', e => { e.stopPropagation(); exportMenu.hidden = !exportMenu.hidden; });

function currentColumns() {
  const cols = [
    { key: 'id', label: 'ID', kind: 'Id' },
    { key: 'type', label: 'Type', kind: 'Type' },
    { key: 'title', label: 'Title', kind: 'Text' },
    { key: 'state', label: 'State', kind: 'Text' },
    { key: 'systemInfo', label: 'System Info', kind: 'Multiline' }
  ];
  if (scOn) cols.push({ key: 'sourceControl', label: 'Source Control', kind: 'Text' });
  extraFields.forEach(ref => cols.push({ key: 'x:' + ref, label: fieldLabel(ref), kind: 'Text' }));
  return cols;
}
function cellText(n, key) {
  if (key === 'id') return '#' + n.Id;
  if (key === 'type') return n.Type || '';
  if (key === 'title') return n.Title || '(untitled)';
  if (key === 'state') return n.State || '';
  if (key === 'systemInfo') return n.Error ? n.Error : (hasInfo(n) ? n.SystemInfo : '');
  if (key === 'sourceControl') { const d = scData(n); return d ? scSummaryText(d) : ''; }
  if (key.indexOf('x:') === 0) return (n.Fields && n.Fields[key.slice(2)]) || '';
  return '';
}

// The exact theme tokens resolved on the live page, so an HTML export reproduces
// the user's current light/dark appearance rather than the headless default.
function currentThemeCss() {
  const cs = getComputedStyle(document.documentElement);
  let vars = '';
  for (let i = 0; i < cs.length; i++) {
    const p = cs[i];
    if (p.slice(0, 2) === '--') vars += p + ':' + cs.getPropertyValue(p).trim() + ';';
  }
  return vars ? (':root{' + vars + '}') : '';
}

// The report view = exactly what the results table is showing right now: the same
// rows, filter, hierarchy, column order and selected extra fields. Renderers only
// format this; they never re-decide what to show.
function buildReportView() {
  const cols = currentColumns();
  const rows = visibleTableRows(filterWithInfo).map(r => {
    const cells = {};
    cols.forEach(c => { cells[c.key] = cellText(r.n, c.key); });
    return { depth: r.depth, groupStart: r.depth === 0, error: !!r.n.Error, cells: cells };
  });

  const viewport = $('#viewport');
  return {
    title: 'TFS System Info',
    subtitle: filterWithInfo ? 'Filtered to Work Items that have System Info' : null,
    generatedAt: resultGeneratedAt ? resultGeneratedAt.replace('T', ' ') : '',
    columns: cols,
    rows: rows,
    html: viewport.innerHTML,                                  // the exact rendered <table>
    themeCss: currentThemeCss(),
    layoutWidthPx: Math.round(viewport.getBoundingClientRect().width)   // so the PDF wraps text exactly as on screen
  };
}

async function exportViaBlob(format, view) {
  const btn = exportBtn;
  const prev = btn.textContent;
  btn.textContent = 'Exporting...'; btn.disabled = true;
  try {
    const resp = await fetch('/api/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ format: format, view: view })
    });
    if (!resp.ok) { alert('Export failed: ' + (await resp.text())); return; }
    const blob = await resp.blob();
    const cd = resp.headers.get('Content-Disposition') || '';
    const m = /filename="?([^"]+)"?/.exec(cd);
    const name = m ? m[1] : ('TfsSystemInfo.' + (format === 'md' ? 'md' : format));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  } catch (e) {
    alert('Export failed to reach the local server.');
  } finally {
    btn.textContent = prev; btn.disabled = false;
  }
}

function doExport(kind) {
  if (!jobId) return;
  if (kind === 'json') { location.href = '/api/result?jobId=' + jobId + '&download=1'; return; }
  exportViaBlob(kind, buildReportView()); // kind is 'xlsx' | 'pdf' | 'md'
}
updateCount();
